name: TG Drop (build TG OneConfig 1.21.11-fabric jar)
on:
  push:
    branches: [mods/oneconfig]
permissions:
  contents: write
concurrency:
  group: tg-drop-oneconfig
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build modules
        run: ./gradlew -p modules publishToMavenLocal 2>&1 | tee -a gradle-build.log
      - name: Build minecraft 1.21.11-fabric
        run: ./gradlew ":minecraft:1.21.11-fabric:assemble" 2>&1 | tee -a gradle-build.log
      - name: Collect jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drop
          shopt -s nullglob
          jars=(minecraft/versions/1.21.11-fabric/build/dist/*.jar)
          echo "jars: ${jars[@]}"
          cp "${jars[@]}" drop/
          ls -la drop

      - name: Debug log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tg-debug
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name gradle-build.log -exec rm -rf {} +
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > run.txt
          git add gradle-build.log run.txt
          git commit -qm "debug log ${{ github.run_id }}"
          git push --force origin tg-debug
      - name: Push jars to tg-drop-oneconfig
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tg-drop-oneconfig
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name drop -exec rm -rf {} +
          git add drop
          git commit -m "TG OneConfig 1.21.11-fabric jar from ${{ github.sha }}"
          git push --force origin tg-drop-oneconfig
