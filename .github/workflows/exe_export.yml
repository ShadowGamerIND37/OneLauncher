name: EXE Export (temporary, local delivery)

# Temporary workflow used to build the Windows exe on this branch and push it
# to the `exe-drop` branch so it can be fetched back through api.github.com /
# codeload.github.com (the only hosts reachable from the build sandbox).
# REMOVE BEFORE MERGE.

on:
  push:
    branches: [arena/6e0db4a6-onelauncher]

concurrency:
  group: exe-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  export-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: false
          restore-cache: true
          cache-namespace: nightly-cache

      - name: (Windows) Stage app-local VC++ runtime
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release exe
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: Package NSIS installer
        shell: bash
        env:
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "version=$VERSION"
          mkdir -p dist
          cp target/release/oneclient_app.exe "dist/TGLauncher_${VERSION}_windows_x86_64.exe"
          shopt -s nullglob
          for f in target/release/*-setup.exe; do
            cp "$f" "dist/TGLauncher_${VERSION}_x64-setup.exe"
          done
          ls -la dist
          gzip -kf dist/*
          ls -la dist

      - name: Push artifacts to exe-drop branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan exe-drop
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name dist -exec rm -rf {} +
          git add dist
          git commit -m "exe drop: TG Launcher windows build from ${{ github.sha }}"
          git push --force origin exe-drop
