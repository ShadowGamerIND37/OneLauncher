name: TG Drop (build TG VanillaHUD 1.21.11 jar)
on:
  push:
    branches: [mods/vanillahud]
permissions:
  contents: write
concurrency:
  group: tg-drop-vanillahud
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout TG OneConfig (sibling branch)
        uses: actions/checkout@v6
        with:
          ref: mods/oneconfig
          path: oneconfig-src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build + publish TG OneConfig to mavenLocal
        shell: bash
        run: |
          cd oneconfig-src
          chmod +x ./gradlew
          ./gradlew -p modules publishToMavenLocal 2>&1 | tee -a gradle-build.log
          ./gradlew ":minecraft:1.21.11-fabric:publishToMavenLocal" 2>&1 | tee -a gradle-build.log
      - name: Build TG VanillaHUD 1.21.11
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew ":1.21.11:build" 2>&1 | tee -a gradle-build.log
      - name: Collect jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drop
          mapfile -t jars < <(find "versions/1.21.11/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          echo "jars: ${jars[@]}"
          cp "${jars[@]}" drop/
          ls -la drop

      - name: Debug log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tg-debug
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name gradle-build.log -exec rm -rf {} +
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > run.txt
          git add gradle-build.log run.txt
          git commit -qm "debug log ${{ github.run_id }}"
          git push --force origin tg-debug
      - name: Push jars to tg-drop-vanillahud
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tg-drop-vanillahud
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name drop -exec rm -rf {} +
          git add drop
          git commit -m "TG VanillaHUD 1.21.11 jar from ${{ github.sha }}"
          git push --force origin tg-drop-vanillahud
